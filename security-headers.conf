add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
# Network isolation: every tool runs client-side against same-origin assets only
# (see docs/PROJECT_STUDY.md §9). This makes that a browser-enforced guarantee.
# That guarantee lives in default-src/connect-src 'self' (plus blob: - the
# LibreOffice WASM converter fetches its own blob: object URLs, created from the
# downloaded soffice.wasm/data, from inside its worker; without connect-src
# allowing blob: those fetches are silently blocked, surfacing as an unexplained
# net::ERR_FAILED on the wasm/data download rather than a CSP violation notice).
#
# script-src must keep 'unsafe-inline'. A static export ships the React Flight
# payload as inline <script> blocks, plus the theme-flash guard in the document
# head; without it the browser blocks all of them and the page never hydrates
# (React error #412 on a blank UI). Hashes are not workable because the Flight
# payload differs per page, and nonces need per-request rendering that
# `output: export` behind plain nginx cannot do.
#
# It also needs 'unsafe-eval': the LibreOffice WASM glue (soffice.js, an
# Emscripten/Embind build we don't control) builds C++ method invoker functions
# at runtime via `new Function(...)` - 'wasm-unsafe-eval' alone only covers
# compiling WebAssembly itself, not that. Without it every soffice.js load
# throws "EvalError: ... violates ... script-src" and LibreOffice never starts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
