[package]
name = "atlaspdf"
version = "1.0.0"
description = "AtlasPDF Desktop Application"
authors = ["AtlasPDF"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Off by default so CI/public release builds never ship an inspectable webview.
# Enable only for a one-off local build with: npx tauri build -f devtools
[features]
devtools = ["tauri/devtools"]
